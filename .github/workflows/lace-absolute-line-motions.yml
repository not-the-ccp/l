name: Lace absolute-line motions

on:
  push:
    branches:
      - work/lace-absolute-line-motions
    paths:
      - .github/workflows/lace-absolute-line-motions.yml

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lace-absolute-line-motions
          fetch-depth: 0
      - name: Apply motion implementation
        run: python3 .github/apply_lace_absolute_lines.py
      - name: Update absolute-line regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/lace_operator_pty.py')
          s = p.read_text()
          old = 'case(root, "visual-gg.txt", b"aa\\nbb\\ncc\\n", b"jvggd", b"a\\ncc\\n")'
          new = 'case(root, "visual-gg.txt", b"aa\\nbb\\ncc\\n", b"jvggd", b"b\\ncc\\n")'
          if s.count(old) != 1:
              raise SystemExit('visual gg expectation changed')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/lace2_pty.py')
          s = p.read_text()
          replacements = [
              ("        # `G` is Lace's document-end motion. A terminating newline must not", "        # Vim-compatible `G` targets first-nonblank on the final real line."),
              ("        # make it target the non-character EOF insertion boundary.", "        # A terminating newline must not create a phantom line below it."),
              ('        assert document_end.read_bytes() == b"one\\ntw\\n", document_end.read_bytes()', '        assert document_end.read_bytes() == b"one\\nwo\\n", document_end.read_bytes()'),
              ('full_help = b"i/a/o edit \\xc2\\xb7 hjkl/arrows/wbe move \\xc2\\xb7 d/y/c ops \\xc2\\xb7 v/V select \\xc2\\xb7 / search \\xc2\\xb7 :w :q \\xc2\\xb7 ^VxFF raw byte"', 'full_help = b"i/a/o edit \\xc2\\xb7 hjkl/arrows/wbe/G/gg move \\xc2\\xb7 d/y/c ops \\xc2\\xb7 v/V select \\xc2\\xb7 / search \\xc2\\xb7 :w :q \\xc2\\xb7 ^VxFF raw byte"'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'compatibility expectation changed: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Build editor
        run: ./build.sh tools
      - name: Focused model regression
        run: ./lr --root . tools/lace2/editor_model_test.l
      - name: Focused operator PTY regression
        run: python3 tests/lace_operator_pty.py
      - name: Focused Lace PTY regression
        run: python3 tests/lace2_pty.py
      - name: Full repository suite
        run: ./test.sh
      - name: Commit tested implementation
        shell: bash
        run: |
          rm .github/apply_lace_absolute_lines.py .github/workflows/lace-absolute-line-motions.yml
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git add -A
          git commit -m 'Add absolute-line G and gg motions to Lace'
          git push origin HEAD:work/lace-absolute-line-motions
