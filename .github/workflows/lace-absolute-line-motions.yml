name: Lace absolute-line motions

on:
  push:
    branches:
      - work/lace-absolute-line-motions
    paths:
      - .github/workflows/lace-absolute-line-motions.yml

permissions:
  contents: write

jobs:
  apply-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lace-absolute-line-motions
          fetch-depth: 0
      - name: Apply motion implementation
        run: python3 .github/apply_lace_absolute_lines.py
      - name: Update absolute-line regression expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/lace_operator_pty.py')
          s = p.read_text()
          needle = 'case(root, "visual-gg.txt", b"aa\\nbb\\ncc\\n", b"jvggd", b"a\\ncc\\n")'
          replacement = 'case(root, "visual-gg.txt", b"aa\\nbb\\ncc\\n", b"jvggd", b"b\\ncc\\n")'
          if s.count(needle) != 1:
              raise SystemExit('visual gg expectation changed')
          p.write_text(s.replace(needle, replacement, 1))

          p = Path('tests/lace2_pty.py')
          s = p.read_text()
          old = '''        # `G` is Lace's document-end motion. A terminating newline must not
          # make it target the non-character EOF insertion boundary.
          document_end = root / "document-end.txt"
          document_end.write_bytes(b"one\\ntwo\\n")
          edit(document_end, b"Gx:wq\\r")
          assert document_end.read_bytes() == b"one\\ntw\\n", document_end.read_bytes()
'''
          new = '''        # Vim-compatible `G` targets first-nonblank on the final real line.
          # A terminating newline must not create a phantom line below it.
          document_end = root / "document-end.txt"
          document_end.write_bytes(b"one\\ntwo\\n")
          edit(document_end, b"Gx:wq\\r")
          assert document_end.read_bytes() == b"one\\nwo\\n", document_end.read_bytes()
'''
          if s.count(old) != 1:
              raise SystemExit('legacy G expectation changed')
          s = s.replace(old, new, 1)
          old_help = 'full_help = b"i/a/o edit \\xc2\\xb7 hjkl/arrows/wbe move \\xc2\\xb7 d/y/c ops \\xc2\\xb7 v/V select \\xc2\\xb7 / search \\xc2\\xb7 :w :q \\xc2\\xb7 ^VxFF raw byte"'
          new_help = 'full_help = b"i/a/o edit \\xc2\\xb7 hjkl/arrows/wbe/G/gg move \\xc2\\xb7 d/y/c ops \\xc2\\xb7 v/V select \\xc2\\xb7 / search \\xc2\\xb7 :w :q \\xc2\\xb7 ^VxFF raw byte"'
          if s.count(old_help) != 1:
              raise SystemExit('help expectation changed')
          p.write_text(s.replace(old_help, new_help, 1))
          PY
      - name: Build editor
        run: ./build.sh tools
      - name: Focused model regression
        run: ./lr --root . tools/lace2/editor_model_test.l
      - name: Focused operator PTY regression
        run: python3 tests/lace_operator_pty.py
      - name: Focused Lace PTY regression
        run: python3 tests/lace2_pty.py
      - name: Full repository suite
        run: ./test.sh
      - name: Commit tested implementation
        shell: bash
        run: |
          rm .github/apply_lace_absolute_lines.py .github/workflows/lace-absolute-line-motions.yml
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git add -A
          git commit -m 'Add absolute-line G and gg motions to Lace'
          git push origin HEAD:work/lace-absolute-line-motions
