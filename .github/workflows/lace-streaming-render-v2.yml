name: Lace streaming redraw v2

on:
  push:
    branches:
      - work/lace-streaming-render-v2
    paths:
      - .github/workflows/lace-streaming-render-v2.yml

permissions:
  contents: write

jobs:
  benchmark-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lace-streaming-render-v2
          fetch-depth: 0
      - name: Build baseline toolchain
        run: ./build.sh tools
      - name: Compile baseline long-line benchmark
        run: ./lc --root . tools/lace2/long_line_bench.l -o /tmp/lace-long-before
      - name: Measure baseline redraw
        run: |
          python3 - <<'PY'
          import subprocess, time
          t = time.perf_counter()
          subprocess.run(['/tmp/lace-long-before'], check=True)
          print(f'BASELINE_LONG_LINE_SECONDS={time.perf_counter() - t:.6f}')
          PY
      - name: Apply piece-aware redraw implementation
        run: python3 .github/apply_lace_streaming_render.py
      - name: Compile optimized long-line benchmark
        run: ./lc --root . tools/lace2/long_line_bench.l -o /tmp/lace-long-after
      - name: Measure optimized redraw
        run: |
          python3 - <<'PY'
          import subprocess, time
          t = time.perf_counter()
          subprocess.run(['/tmp/lace-long-after'], check=True)
          print(f'OPTIMIZED_LONG_LINE_SECONDS={time.perf_counter() - t:.6f}')
          PY
      - name: Rebuild Lace
        run: ./build.sh tools
      - name: Focused navigation regression
        run: ./lr --root . tools/lace2/navigation_test.l
      - name: Focused render regression
        run: ./lr --root . tools/lace2/render_test.l
      - name: Full repository suite
        run: ./test.sh
      - name: Commit tested implementation
        shell: bash
        run: |
          rm tools/lace2/long_line_bench.l .github/apply_lace_streaming_render.py .github/workflows/lace-streaming-render-v2.yml
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git add -A
          git commit -m 'Stream Lace redraws over the piece tree'
          git push origin HEAD:work/lace-streaming-render-v2
