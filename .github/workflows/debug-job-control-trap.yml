name: Diagnose job-control PTY trap

on:
  push:
    branches:
      - debug/job-control-trap

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/linux_job_control_pty.py
