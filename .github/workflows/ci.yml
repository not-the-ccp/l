name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core conformance (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Toolchain versions
        run: |
          python --version
          cc --version | head -n 1
      - name: Core conformance
        run: python conformance/core_conformance.py
      - name: Parse/link/type-check freestanding examples without a main convention
        run: |
          PYTHONPATH=bootstrap python - <<'PY'
          from pathlib import Path
          from core import Program

          for path in sorted(Path('examples/core').glob('*.l')):
              Program({('example',): path.read_text(encoding='utf-8')}, host_modules={})
              print(f'{path}: ok')
          PY

  full:
    name: Full toolchain and tooling suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional graph tooling
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Full test suite
        run: ./test.sh
      - name: L-written project resolver stress
        run: |
          ./lr examples/portable/resolver_demo.l
          ./lc examples/portable/resolver_demo.l -o /tmp/resolver-demo
          /tmp/resolver-demo
      - name: L-written declaration/type parser stress
        run: |
          ./lr examples/portable/signatures_demo.l
          ./lc examples/portable/signatures_demo.l -o /tmp/signatures-demo
          /tmp/signatures-demo
      - name: L-written type resolver stress
        run: |
          ./lr examples/portable/type_resolution_demo.l
          ./lc examples/portable/type_resolution_demo.l -o /tmp/type-resolution-demo
          /tmp/type-resolution-demo
      - name: L-written body AST parser stress
        run: |
          ./lr examples/portable/body_ast_demo.l
          ./lc examples/portable/body_ast_demo.l -o /tmp/body-ast-demo
          /tmp/body-ast-demo
      - name: L-written lexical resolver stress
        run: |
          ./lr examples/portable/name_resolution_demo.l
          ./lc examples/portable/name_resolution_demo.l -o /tmp/name-resolution-demo
          /tmp/name-resolution-demo
      - name: L-written basic semantic checker stress
        run: |
          ./lr examples/portable/checker_demo.l
          ./lc examples/portable/checker_demo.l -o /tmp/checker-demo
          /tmp/checker-demo
      - name: Build native tools
        run: ./build.sh tools
      - name: Analyze an example
        run: |
          ./lc analyze examples/core/linked_list.l --view cfg --format dot -o /tmp/linked-list.dot
          test -s /tmp/linked-list.dot
