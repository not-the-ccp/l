name: Lace const-kernel dogfood

on:
  push:
    branches: [work/lace-const-kernel]
    paths:
      - .github/workflows/lace-const-kernel.yml

permissions:
  contents: write

jobs:
  rewrite-test-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lace-const-kernel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply const capability annotations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s) of {old!r}, got {text.count(old)}")
              p.write_text(text.replace(old, new, count))

          p = "tools/lace2/piece_tree.l"
          replace(p, "    original: []u8,", "    original: const []u8,")
          replace(p, "fn piece_source(text: ref Text, source: Source) -> []u8 {", "fn piece_source(text: ref Text, source: Source) -> const []u8 {")
          replace(p, "fn count_newlines(src: []u8, start: u64, length: u64) -> u64 {", "fn count_newlines(src: const []u8, start: u64, length: u64) -> u64 {")
          replace(p, "fn build_balanced(pieces: []Piece, start: u64, end: u64) -> ?ref Node {", "fn build_balanced(pieces: const []Piece, start: u64, end: u64) -> ?ref Node {")
          replace(p, "pub fn from_bytes(data: []u8) -> ref Text {", "pub fn from_bytes(data: const []u8) -> ref Text {")
          replace(p, "pub fn replace(text: ref Text, start: u64, end: u64, replacement: []u8) {", "pub fn replace(text: ref Text, start: u64, end: u64, replacement: const []u8) {")

          p = "tools/lace2/transaction.l"
          replace(p, "    pub inserted: []u8,", "    pub inserted: const []u8,", 2)
          replace(p, "    pub removed: []u8,", "    pub removed: const []u8,")
          replace(p, "    pub edits: []AppliedEdit,", "    pub edits: const []AppliedEdit,")
          replace(p, "fn validate_specs(doc: ref text.Text, specs: []EditSpec) {", "fn validate_specs(doc: ref text.Text, specs: const []EditSpec) {")
          replace(p, "pub fn apply(doc: ref text.Text, specs: []EditSpec) -> Transaction {", "pub fn apply(doc: ref text.Text, specs: const []EditSpec) -> Transaction {")

          p = "tools/lace2/history.l"
          replace(p, "    label: []u8,", "    label: const []u8,")
          replace(p, "    label: []u8\n) -> u64 {", "    label: const []u8\n) -> u64 {")
          PY
      - name: Full repository test suite
        run: ./test.sh
      - name: Commit const-correct Lace kernel
        shell: bash
        run: |
          rm .github/workflows/lace-const-kernel.yml
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git add -A
          git commit -m 'Use const arrays in Lace buffer and history kernel'
          git push origin HEAD:work/lace-const-kernel
