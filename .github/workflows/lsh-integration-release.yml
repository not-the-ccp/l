name: lsh integration + development release

on:
  push:
    branches: [feature/shell-external-jobs]
    paths:
      - '.github/apply_shell_foreground_integration.py'
      - '.github/workflows/lsh-integration-release.yml'

permissions:
  contents: write

jobs:
  integrate-test-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shell-external-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply foreground integration
        run: python3 .github/apply_shell_foreground_integration.py

      - name: Focused shell checks
        run: |
          ./build.sh tools
          ./lc --check tools/shell/main.l >/dev/null
          python3 tests/shell_pty.py
          python3 bootstrap/sdk_cli.py run examples/hosted/linux_signal_disposition_probe.l
          native_probe=$(mktemp)
          rm -f "$native_probe"
          ./lc examples/hosted/linux_signal_disposition_probe.l -o "$native_probe" >/dev/null
          "$native_probe"
          rm -f "$native_probe"

      - name: Full repository test suite
        run: ./test.sh

      - name: Commit tested production state
        shell: bash
        run: |
          rm .github/apply_shell_foreground_integration.py .github/workflows/lsh-integration-release.yml
          git config user.name 'not-the-ccp'
          git config user.email '315506978+not-the-ccp@users.noreply.github.com'
          git add -A
          git commit -m 'Harden lsh foreground process handoff'
          git push origin HEAD:feature/shell-external-jobs
          final_sha=$(git rev-parse HEAD)
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"

      - name: Build lsh release binary
        run: |
          ./build.sh tools
          install -m 0755 build/lsh lsh-linux-x86_64
          sha256sum lsh-linux-x86_64 > lsh-linux-x86_64.sha256
          file lsh-linux-x86_64

      - name: Keep workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsh-linux-x86_64-${{ github.run_id }}
          path: |
            lsh-linux-x86_64
            lsh-linux-x86_64.sha256
          retention-days: 90

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${FINAL_SHA:0:7}
          tag="lsh-dev-${short}"
          cat > /tmp/notes.md <<EOF
          Development dogfood build of lsh from commit ${FINAL_SHA}.

          Platform: Linux x86_64 (Ubuntu 24.04 runner)

          This build includes the current stacked foreground-job work: race-free tty handoff, process-group job control, jobs/fg/bg, stopped-job terminal-mode restoration, and shell signal-disposition hardening. It is a prerelease and not a compatibility promise.
          EOF
          gh release create "$tag" \
            lsh-linux-x86_64 \
            lsh-linux-x86_64.sha256 \
            --target "$FINAL_SHA" \
            --title "lsh development build ${short}" \
            --notes-file /tmp/notes.md \
            --prerelease
