name: One-shot generic layout fix

on:
  push:
    branches: ['work/fix-generic-value-layouts']

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fix-generic-value-layouts
      - name: Apply semantic fix and regression cases
        run: |
          python tools/dev/fix_generic_layout_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bootstrap/core.py conformance/core_conformance.py
          git commit -m 'Reject recursive value layouts hidden by generics'
          git push origin HEAD:work/fix-generic-value-layouts
